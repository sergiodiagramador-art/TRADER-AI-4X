name: Build TRADER AI 4X Overlay APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'overlay-android/**'
      - '.github/workflows/build-overlay-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overlay-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trader-ai-4x-overlay-debug
          path: overlay-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
