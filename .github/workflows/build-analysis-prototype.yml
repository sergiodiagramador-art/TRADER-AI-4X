name: Build TRADER-AI-4X analysis prototype

on:
  push:
    branches: [analysis-prototype]
    paths:
      - 'android-capture/**'
      - '.github/workflows/build-analysis-prototype.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p android-capture :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trader-ai-4x-analysis-prototype
          path: android-capture/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
